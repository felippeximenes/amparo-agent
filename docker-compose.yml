# Opcional. O dev roda o Qdrant em modo local (arquivo), sem este serviço.
# Útil para inspecionar o índice no dashboard (http://localhost:6333/dashboard)
# ou como base para o deploy.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
